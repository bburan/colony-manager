[project]
name = "colony-manager"
description = "Database schema and optional GUI for colony management"
readme = "README.md"
requires-python = ">=3.7"
license = {file = "license.txt"}
authors = [
    {name = "Brad Buran", email="buran@ohsu.edu"},
]
maintainers = [
    {name = "Brad Buran", email="buran@ohsu.edu"},
]
dependencies = [
    "sqlalchemy",
    "sqlalchemy_continuum",
	"psycopg2-binary",
	"xxhash",
]
dynamic = ["version"]

[project.optional-dependencies]
gui = [
	# Not sure if all of these are needed. Maybe legacy cruft.
	"alembic",
    "werkzeug",
	"Flask>=2.0",
	"Flask-SQLAlchemy>=2.5",
	"Flask-WTF>=1.0",
	"flask-login",
	"python-dotenv>=0.19",
	"WTForms[email]>=3.0",
	"wtforms-sqlalchemy",
	"Pillow>=10.0",
]
test = [
	"pytest>=7.0",
	"pytest-xdist",
	"alembic",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
	"ignore::DeprecationWarning",
	# sqlalchemy_continuum's autogenerated migrations declare
	# ``primary_key=True`` on individual columns AND pass a separate
	# ``PrimaryKeyConstraint``; SQLAlchemy reconciles correctly but
	# warns. Fires once per session during the template-build
	# ``alembic upgrade head``.
	"ignore:Table .* specifies columns .* as primary_key=True, not matching:sqlalchemy.exc.SAWarning",
	# Alembic emits this on every ``alter_column`` against Postgres
	# because ``autoincrement`` is a MySQL-only concept. Harmless.
	"ignore:autoincrement and existing_autoincrement only make sense for MySQL:UserWarning",
]

[build-system]
requires = ["setuptools>=61.2", "wheel", "setuptools_scm[toml]>=3.4.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/colony_manager/version.py"

[tool.setuptools.packages.find]
where = ["src"]
