{% extends "base.html" %}

{% block header %}
Event Calendar
{% endblock %}

{% block content %}
<article class="card border-0 shadow-sm">
    <header class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
        <div class="d-flex gap-3">
            <div class="d-flex align-items-center">
                <span class="badge rounded-pill bg-primary me-2" style="width: 12px; height: 12px; padding: 0;">&nbsp;</span>
                <span class="small fw-bold text-secondary text-uppercase" style="font-size: 0.65rem;">Scheduled</span>
            </div>
            <div class="d-flex align-items-center">
                <span class="badge rounded-pill bg-success me-2" style="width: 12px; height: 12px; padding: 0;">&nbsp;</span>
                <span class="small fw-bold text-secondary text-uppercase" style="font-size: 0.65rem;">Completed</span>
            </div>
        </div>

    </header>

    <main class="card-body p-4">
        <div id="calendar"></div>
    </main>
</article>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<style>
    :root {
        --fc-border-color: #f1f3f5;
        --fc-button-bg-color: #f8f9fa;
        --fc-button-border-color: #dee2e6;
        --fc-button-text-color: #495057;
        --fc-button-hover-bg-color: #e9ecef;
        --fc-button-active-bg-color: #0d6efd;
        --fc-button-active-border-color: #0d6efd;
        --fc-today-bg-color: rgba(13, 110, 253, 0.04);
    }

    /* Toolbar Styling */
    .fc .fc-toolbar-title {
        font-size: 1.15rem;
        font-weight: 800;
        color: #212529;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .fc .fc-button {
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: capitalize;
        padding: 0.4rem 0.8rem;
        box-shadow: none !important;
    }
    .fc .fc-button-primary:not(:disabled).fc-button-active {
        color: #fff;
    }

    /* Event Styling */
    .fc-event {
        cursor: pointer;
        border: none !important;
        border-radius: 4px;
        padding: 1px 4px;
        font-size: 0.8rem;
        transition: transform 0.1s ease;
    }
    .fc-event:hover {
        transform: scale(1.02);
    }

    /* Tooltip */
    .fc-tooltip .tooltip-inner {
        text-align: left;
        max-width: 300px;
    }

    /* List View Customization */
    .fc-list-day-cushion {
        background-color: #f8f9fa !important;
    }
    .fc-list-event:hover td {
        background-color: rgba(0,0,0,0.02) !important;
    }
    .fc-list-event-title a {
        color: #212529 !important;
        text-decoration: none !important;
        font-weight: 600;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            height: 'auto',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,listMonth' // Added listMonth toggle here
            },
            buttonText: {
                today: 'Today',
                month: 'Grid',
                list: 'Agenda' // Renamed for clarity
            },
            events: {{ calendar_events|tojson }},
            eventDidMount: function(info) {
                const props = info.event.extendedProps;
                const animals = props.animals && props.animals.length
                    ? props.animals.map(a => a.label).join(', ')
                    : '—';
                new bootstrap.Tooltip(info.el, {
                    title: animals,
                    placement: 'top',
                    trigger: 'hover',
                    container: 'body',
                    customClass: 'fc-tooltip',
                });
            },
            eventWillUnmount: function(info) {
                const tip = bootstrap.Tooltip.getInstance(info.el);
                if (tip) tip.dispose();
            },
            eventClick: function(info) {
                info.jsEvent.preventDefault();
                const event = info.event;
                const props = event.extendedProps;
                const baseUrl = '{{ url_for("animals.view_animal", animal_id=0) }}'.replace('/0', '/');
                document.getElementById('dictModalTitle').textContent = event.title;
                document.getElementById('dictModalBody').innerHTML =
                    '<div class="list-group list-group-flush">' +
                    props.animals.map(a =>
                        `<a href="${baseUrl}${a.id}" class="list-group-item list-group-item-action">${a.label}</a>`
                    ).join('') +
                    '</div>';
                bootstrap.Modal.getOrCreateInstance(document.getElementById('dictModal')).show();
            }
        });
        calendar.render();
    });
</script>
{% endblock %}
